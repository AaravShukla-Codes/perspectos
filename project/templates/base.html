<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Perspectos · One Word. Unlimited Perspectives.{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">Perspect<span>os</span></a>
      <nav class="nav" aria-label="Main">
        {% if me %}
          {% if me.is_admin %}<a href="{{ url_for('admin_page') }}">Reports</a>{% endif %}
          <a href="{{ url_for('profile_page', username=me.username) }}">{{ me.username }}</a>
          <button id="logout-btn" class="btn btn-small" type="button">Log out</button>
        {% else %}
          <a href="{{ url_for('login_page') }}">Log in</a>
          <a class="btn btn-small btn-primary" href="{{ url_for('register_page') }}">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Perspectos · One Word. Unlimited Perspectives.</div>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>

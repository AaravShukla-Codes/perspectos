{% extends "base.html" %}
{% block title %}Sign up · Perspectos{% endblock %}
{% block page %}register{% endblock %}

{% block content %}
<section class="narrow">
  <h1>Join the conversation</h1>
  <form id="register-form" class="stack card" autocomplete="on">
    <label>Username
      <input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username">
      <small class="muted">3-20 characters: letters, numbers, underscore.</small>
    </label>
    <label>Email
      <input name="email" type="email" required maxlength="120" autocomplete="email">
    </label>
    <label>Password
      <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
      <small class="muted">At least 8 characters.</small>
    </label>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="muted center">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
</section>
{% endblock %}
